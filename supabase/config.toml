[functions.cms-worker]
# The handler requires a private x-worker-secret before any database access.
# JWT verification cannot authenticate this dedicated Cron credential.
verify_jwt = false
entrypoint = "./functions/cms-worker/index.js"

[functions.webflow-userinfo]
# Supabase Auth supplies a Webflow OAuth token; the handler validates it with Webflow.
# It cannot be validated as a Supabase JWT. No database or service-role access.
verify_jwt = false
entrypoint = "./functions/webflow-userinfo/index.js"
